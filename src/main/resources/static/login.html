<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartAttend | Bihar Engineering University, Patna</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, rgba(248, 250, 252, 1) 90%);
            padding: 1.5rem;
        }
        [data-theme="dark"] .login-page-wrapper {
            background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.12) 0%, rgba(11, 17, 32, 1) 90%);
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }
        .demo-badge-btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .demo-badge-btn:hover {
            border-color: var(--primary);
            background: var(--primary-subtle);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="login-page-wrapper">
        <div class="login-card">
            <div class="p-4 p-md-5">
                <!-- University & App Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center brand-icon mb-3" style="width: 58px; height: 58px; font-size: 1.75rem;">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <h3 class="fw-bold mb-1">SmartAttend</h3>
                    <p class="text-muted small mb-2">Subject Wise Attendance Management System</p>
                    <div class="university-tag d-inline-flex mx-auto">
                        <i class="fas fa-university"></i>
                        <span>Bihar Engineering University, Patna</span>
                    </div>
                </div>

                <!-- Alert Message -->
                <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert"></div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small text-muted">Username / Registration / Roll No</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="e.g. admin, faculty, student" required autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold small text-muted mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-erp-primary w-100 py-2 mb-4 justify-content-center">
                        Sign In to Portal <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </form>

                <!-- Quick 1-Click Demo Accounts -->
                <div class="border-top pt-3">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="text-muted small fw-bold text-uppercase" style="letter-spacing: 0.05em;">Quick Demo Logins</span>
                        <span class="badge bg-secondary-subtle text-secondary small">Session 2026-2030</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-4">
                            <div class="demo-badge-btn" onclick="fillCredentials('admin')">
                                <div class="fw-bold text-primary small"><i class="fas fa-shield-halved me-1"></i> Admin</div>
                                <div class="text-muted" style="font-size: 0.68rem;">admin / Admin@123</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="demo-badge-btn" onclick="fillCredentials('faculty')">
                                <div class="fw-bold text-success small"><i class="fas fa-chalkboard-user me-1"></i> Faculty</div>
                                <div class="text-muted" style="font-size: 0.68rem;">faculty / Faculty@123</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="demo-badge-btn" onclick="fillCredentials('student')">
                                <div class="fw-bold text-info small"><i class="fas fa-user-graduate me-1"></i> Dilkhush</div>
                                <div class="text-muted" style="font-size: 0.68rem;">26CSE14 / Student@123</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Theme Switcher & Footer -->
                <div class="d-flex justify-content-between align-items-center mt-4 pt-2 text-muted small border-top">
                    <span>B.Tech 1st Sem (Group-A)</span>
                    <button class="header-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js?v=1.0.1"></script>
    <script src="/js/auth.js?v=1.0.1"></script>
</body>
</html>
